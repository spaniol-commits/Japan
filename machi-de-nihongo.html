ーをお願いします。`,`Takushī o onegai shimasu.`,`A taxi, please.`,`That calls a taxi.`)]},{npc:$(`パスポートをお願いします。`,`Pasupōto o onegai shimasu.`,`Your passport, please.`),goal:`Hand it over: "Here you are."`,options:[$(`はい、どうぞ。`,`Hai, dōzo.`,`Here you are.`),$(`いいえ、結構です。`,`Iie, kekkō desu.`,`No, thank you.`,`That refuses.`),$(`いただきます。`,`Itadakimasu.`,`(Before eating.)`,`That is for meals.`)]},{npc:$(`お部屋は十二階です。`,`O-heya wa jūnikai desu.`,`Your room is on the 12th floor.`),goal:`Ask from what time breakfast is served.`,options:[$(`朝ごはんは何時からですか？`,`Asagohan wa nanji kara desu ka?`,`From what time is breakfast?`),$(`晩ごはんは何ですか？`,`Bangohan wa nan desu ka?`,`What's for dinner?`,`Bangohan is dinner.`),$(`朝ごはんはいくらでしたか？`,`Asagohan wa ikura deshita ka?`,`How much was breakfast?`,`Past tense, and it's about price.`)]}]},fukuya:{role:{jp:`店員さん`,en:`shop assistant`},spot:[150,4.6],turns:[{npc:$(`いらっしゃいませ！何かお探しですか？`,`Irasshaimase! Nanika o-sagashi desu ka?`,`Welcome! Looking for something?`),goal:`Ask if they have this in medium.`,options:[$(`これのMサイズはありますか？`,`Kore no emu saizu wa arimasu ka?`,`Do you have this in medium?`),$(`これはいくらでしたか？`,`Kore wa ikura deshita ka?`,`How much was this?`,`That asks the price, in the past tense.`),$(`Mサイズはいりません。`,`Emu saizu wa irimasen.`,`I don't need a medium.`,`The opposite of what you want.`)]},{npc:$(`はい、ございます。`,`Hai, gozaimasu.`,`Yes, we have it.`),goal:`Ask if you may try it on.`,options:[$(`試着してもいいですか？`,`Shichaku shite mo ii desu ka?`,`May I try it on?`),$(`試食してもいいですか？`,`Shishoku shite mo ii desu ka?`,`May I taste it?`,`Shishoku is tasting food samples. Close!`),$(`着替えてください。`,`Kigaete kudasai.`,`Please change your clothes.`,`That tells her to change.`)]},{npc:$(`いかがでしたか？`,`Ikaga deshita ka?`,`How was it?`),goal:`Say you'll take it.`,options:[$(`これにします。`,`Kore ni shimasu.`,`I'll take this one.`),$(`これは何ですか？`,`Kore wa nan desu ka?`,`What is this?`,`You already know what it is.`),$(`また来ました。`,`Mata kimashita.`,`I came again.`,`That talks about coming back.`)
